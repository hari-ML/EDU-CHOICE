<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDU Choice</title>
    <!-- Vercel Speed Insights -->
    <script>
        window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#4f46e5',
                        primaryHover: '#4338ca',
                        safe: '#10b981',
                        medium: '#f59e0b',
                        risky: '#ef4444',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #334155; transition: background-color 0.3s, color 0.3s; }
        html.dark body { background-color: #0f172a; color: #cbd5e1; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        html.dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
        html.dark .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        .table-row-hover:hover { background-color: #f8fafc; }
        html.dark .table-row-hover:hover { background-color: #1e293b; }
        
        /* Custom Checkbox */
        .custom-checkbox {
            appearance: none;
            background-color: #fff;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.15em;
            height: 1.15em;
            border: 1.5px solid #cbd5e1;
            border-radius: 0.25em;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        html.dark .custom-checkbox { background-color: #1e293b; border-color: #475569; }
        
        .custom-checkbox::before {
            content: "";
            width: 0.65em;
            height: 0.65em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            background-color: transform;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .custom-checkbox:checked {
            background-color: #4f46e5;
            border-color: #4f46e5;
        }
        .custom-checkbox:checked::before {
            transform: scale(1);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // --- Data ---
        // Data is now loaded dynamically from data.json
        
        const CATEGORIES = ['OC', 'BC', 'BCM', 'MBC', 'SC', 'SCA', 'ST'];
        const DEPARTMENTS = ['CSE', 'IT', 'ECE', 'EEE', 'MECH', 'CIVIL', 'BME', 'AI & DS'];
        const DISTRICTS = ['All', 'Ariyalur', 'Chengalpattu', 'Chennai', 'Coimbatore', 'Cuddalore', 'Dharmapuri', 'Dindigul', 'Erode', 'Kallakurichi', 'Kanchipuram', 'Kanyakumari', 'Karur', 'Krishnagiri', 'Madurai', 'Mayiladuthurai', 'Nagapattinam', 'Namakkal', 'Nilgiris', 'Perambalur', 'Pudukkottai', 'Ramanathapuram', 'Ranipet', 'Salem', 'Sivaganga', 'Tenkasi', 'Thanjavur', 'Theni', 'Thoothukudi', 'Tiruchirappalli', 'Tirunelveli', 'Tirupathur', 'Tiruppur', 'Tiruvallur', 'Tiruvannamalai', 'Tiruvarur', 'Vellore', 'Viluppuram', 'Virudhunagar'];
        const YEARS = [2025, 2024, 2023, 2022, 2021];

        // --- Icons ---
        const Icons = {
            Search: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>,
            Filter: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>,
            X: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>,
            Scale: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"></path></svg>,
            ChevronDown: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg>,
            Sun: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>,
            Moon: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>,
            Award: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>,
            CurrencyRupee: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 8h6m-5 0a3 3 0 110 6H9l3 3m-3-6h6m6 1a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        };

        // --- Components ---

        const CompareModal = ({ isOpen, onClose, compareList, category, onRemove }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/50 dark:bg-black/50 backdrop-blur-sm z-50 flex justify-center items-center p-4">
                    <div className="bg-white dark:bg-slate-900 rounded-2xl w-full max-w-5xl max-h-[90vh] overflow-y-auto custom-scrollbar shadow-2xl animate-in fade-in zoom-in-95 duration-200">
                        <div className="p-4 md:p-6 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center sticky top-0 bg-white/90 dark:bg-slate-900/90 backdrop-blur z-10">
                            <h2 className="text-xl md:text-2xl font-bold text-slate-800 dark:text-white flex items-center gap-2">
                                <Icons.Scale /> Compare Colleges
                            </h2>
                            <button onClick={onClose} className="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg text-slate-500 transition-colors">
                                <Icons.X />
                            </button>
                        </div>
                        <div className="p-4 md:p-6 overflow-x-auto">
                            {compareList.length === 0 ? (
                                <div className="text-center py-12 text-slate-500">
                                    No colleges selected for comparison.
                                </div>
                            ) : (
                                <table className="w-full text-left border-collapse min-w-[600px]">
                                    <thead>
                                        <tr>
                                            <th className="p-3 border-b border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 font-semibold w-32">Metric</th>
                                            {compareList.map(c => (
                                                <th key={c.id} className="p-3 border-b border-l border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/30 w-64 relative">
                                                    <div className="font-bold text-primary text-sm line-clamp-2 pr-6">{c.college}</div>
                                                    <div className="text-xs text-slate-500 font-normal mt-1">{c.branch} - {c.year}</div>
                                                    <button onClick={() => onRemove(c)} className="absolute top-2 right-2 p-1 text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded">
                                                        <Icons.X />
                                                    </button>
                                                </th>
                                            ))}
                                            {compareList.length > 0 && compareList.length < 4 && (
                                                <th className="p-4 border-l border-slate-200 dark:border-slate-700 align-middle text-center w-40 bg-slate-50/50 dark:bg-slate-800/30">
                                                    <button 
                                                        onClick={onClose}
                                                        className="flex flex-col items-center justify-center gap-2 text-primary hover:text-primaryHover dark:text-indigo-400 dark:hover:text-indigo-300 transition-colors mx-auto"
                                                    >
                                                        <div className="w-10 h-10 rounded-full bg-indigo-50 dark:bg-indigo-900/30 flex items-center justify-center border border-indigo-100 dark:border-indigo-800">
                                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>
                                                        </div>
                                                        <span className="text-xs font-bold">Add College</span>
                                                    </button>
                                                </th>
                                            )}
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-200 dark:divide-slate-700">
                                        <tr>
                                            <td className="p-4 font-medium text-slate-700 dark:text-slate-300 text-sm bg-slate-50 dark:bg-slate-800/30">District</td>
                                            {compareList.map(item => (
                                                <td key={item.id} className="p-4 text-slate-600 dark:text-slate-400 text-sm border-l border-slate-200 dark:border-slate-700">{item.district}</td>
                                            ))}
                                            {compareList.length > 0 && compareList.length < 4 && <td className="border-l border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/30"></td>}
                                        </tr>
                                        <tr>
                                            <td className="p-4 font-medium text-slate-700 dark:text-slate-300 text-sm bg-slate-50 dark:bg-slate-800/30">NIRF Ranking</td>
                                            {compareList.map(item => (
                                                <td key={item.id} className="p-4 text-slate-800 dark:text-slate-200 text-sm font-bold border-l border-slate-200 dark:border-slate-700">#{item.nirf || 'N/A'}</td>
                                            ))}
                                            {compareList.length > 0 && compareList.length < 4 && <td className="border-l border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/30"></td>}
                                        </tr>
                                        <tr>
                                            <td className="p-4 font-medium text-slate-700 dark:text-slate-300 text-sm bg-slate-50 dark:bg-slate-800/30 align-top">Placements (LPA)</td>
                                            {compareList.map(item => (
                                                <td key={item.id} className="p-4 text-sm border-l border-slate-200 dark:border-slate-700 align-top">
                                                    {item.package ? (
                                                        <div className="space-y-1">
                                                            <div className="flex justify-between w-full">
                                                                <span className="text-slate-500 dark:text-slate-400">Avg:</span>
                                                                <span className="font-semibold text-slate-700 dark:text-slate-200">{item.package.avg}</span>
                                                            </div>
                                                            <div className="flex justify-between w-full">
                                                                <span className="text-slate-500 dark:text-slate-400">Median:</span>
                                                                <span className="font-semibold text-slate-700 dark:text-slate-200">{item.package.median}</span>
                                                            </div>
                                                            <div className="flex justify-between w-full">
                                                                <span className="text-emerald-600 dark:text-emerald-400 font-medium">Highest:</span>
                                                                <span className="font-bold text-emerald-600 dark:text-emerald-400">{item.package.high}</span>
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <span className="text-slate-400">Data Unavailable</span>
                                                    )}
                                                </td>
                                            ))}
                                            {compareList.length > 0 && compareList.length < 4 && <td className="border-l border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/30"></td>}
                                        </tr>
                                        {CATEGORIES.map(cat => (
                                            <tr key={cat}>
                                                <td className={`p-4 text-sm bg-slate-50 dark:bg-slate-800/30 ${cat === category ? 'font-bold text-primary dark:text-indigo-400' : 'font-medium text-slate-700 dark:text-slate-300'}`}>
                                                    {cat} Cutoff
                                                </td>
                                                {compareList.map(item => (
                                                    <td key={item.id} className={`p-4 text-sm border-l border-slate-200 dark:border-slate-700 ${cat === category ? 'font-bold text-primary dark:text-indigo-400 bg-indigo-50/30 dark:bg-indigo-900/20' : 'text-slate-600 dark:text-slate-400'}`}>
                                                        {item.cutoff[cat] || '-'}
                                                    </td>
                                                ))}
                                                {compareList.length > 0 && compareList.length < 4 && <td className="border-l border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/30"></td>}
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const FeedbackModal = ({ isOpen, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/60 dark:bg-black/60 backdrop-blur-sm z-50 flex justify-center items-center p-4">
                    <div className="bg-white dark:bg-slate-900 rounded-3xl w-full max-w-sm shadow-2xl overflow-hidden border border-slate-100 dark:border-slate-800 animate-in fade-in zoom-in-95 duration-200">
                        <div className="bg-gradient-to-br from-primary to-indigo-600 p-6 flex justify-between items-start text-white relative overflow-hidden">
                            <div className="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 bg-white/10 rounded-full blur-2xl"></div>
                            <div className="relative z-10 flex flex-col gap-1">
                                <h3 className="font-black text-2xl leading-tight tracking-tight">Let's Connect!</h3>
                                <p className="text-indigo-100 text-sm font-medium">Feedback & Explore</p>
                            </div>
                            <button onClick={onClose} className="relative z-10 text-white/70 hover:text-white bg-white/10 hover:bg-white/20 p-2 rounded-xl transition-all hover:rotate-90">
                                <Icons.X />
                            </button>
                        </div>
                        <div className="px-6 pb-6 pt-8">
                            <div className="flex flex-col items-center text-center">
                                <div className="w-24 h-24 bg-gradient-to-br from-slate-50 to-slate-100 dark:from-slate-800 dark:to-slate-900 rounded-full flex items-center justify-center border-4 border-white dark:border-slate-800 shadow-xl -mt-16 relative z-10 text-4xl">
                                    👨‍💻
                                </div>
                                <div className="mt-4">
                                    <h4 className="text-2xl font-black text-slate-800 dark:text-white tracking-tight">Hareaindiran S</h4>
                                    <div className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-indigo-50 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-400 text-[10px] font-bold uppercase tracking-wider mt-2">
                                        <div className="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-pulse"></div>
                                        Creator & Developer
                                    </div>
                                </div>
                                <div className="bg-slate-50 dark:bg-slate-800/40 p-5 rounded-2xl border border-slate-100 dark:border-slate-700/50 w-full mt-6 shadow-inner">
                                    <p className="text-slate-600 dark:text-slate-300 font-medium text-sm leading-relaxed mb-4">
                                        Feel free to send feedback or ask for updates! I'd love to hear your thoughts.
                                    </p>
                                    <a href="mailto:0709hari@gmail.com" className="group flex items-center justify-center gap-2 w-full py-3.5 bg-slate-900 dark:bg-primary hover:bg-slate-800 dark:hover:bg-primaryHover text-white rounded-xl font-bold transition-all shadow-md hover:shadow-lg">
                                        <span className="group-hover:-translate-y-0.5 transition-transform">✉️</span> 
                                        0709hari@gmail.com
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const FilterPanel = ({ 
            userMark, setUserMark, 
            category, setCategory, 
            department, setDepartment,
            district, setDistrict,
            year, setYear,
            showSafe, setShowSafe,
            isMobileOpen, setIsMobileOpen
        }) => {
            const panelClasses = `bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 w-full md:w-72 flex-shrink-0 flex flex-col fixed md:sticky top-0 h-screen z-40 transition-transform duration-300 ease-in-out ${
                isMobileOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'
            }`;

            return (
                <div className={panelClasses}>
                    <div className="p-5 border-b border-slate-100 dark:border-slate-800 flex flex-col gap-3 bg-white dark:bg-slate-900 sticky top-0 z-10 transition-colors">
                        <div className="flex justify-between items-center w-full">
                            <div className="flex items-center gap-3">
                                <div className="bg-white rounded-full p-0.5 shadow-sm">
                                    <img src="./logo.png" alt="EduChoice" className="w-10 h-10 object-contain" />
                                </div>
                                <div className="flex flex-col">
                                    <span className="font-black text-xl tracking-tight text-slate-800 dark:text-white leading-none">EDUCHOICE</span>
                                    <span className="text-[9px] font-bold text-amber-500 mt-1 uppercase tracking-wider animate-pulse whitespace-nowrap">TNEA 2026 Coming Soon</span>
                                </div>
                            </div>
                            <button className="md:hidden p-2 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-lg" onClick={() => setIsMobileOpen(false)}>
                                <Icons.X />
                            </button>
                        </div>
                    </div>

                    <div className="p-5 overflow-y-auto custom-scrollbar flex-1 space-y-6">
                        
                        {/* Cutoff Input */}
                        <div>
                            <label className="block text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2">Your Cutoff Mark</label>
                            <input 
                                type="number" 
                                value={userMark} 
                                onChange={(e) => setUserMark(e.target.value)}
                                placeholder="e.g. 195.5"
                                className="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all font-medium text-sm"
                                step="0.5"
                                min="0" max="200"
                            />
                            {userMark > 0 && (
                                <div className="mt-3 flex items-center gap-2">
                                    <label className="flex items-center gap-2 cursor-pointer text-sm font-medium text-slate-600 dark:text-slate-300">
                                        <input 
                                            type="checkbox" 
                                            checked={showSafe}
                                            onChange={(e) => setShowSafe(e.target.checked)}
                                            className="w-4 h-4 text-emerald-500 rounded focus:ring-emerald-500 custom-checkbox"
                                        />
                                        Show only <span className="text-emerald-600 dark:text-emerald-400 font-bold">Safe</span> colleges
                                    </label>
                                </div>
                            )}
                        </div>

                        {/* Year & Category Row */}
                        <div className="grid grid-cols-2 gap-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2">Year</label>
                                <div className="relative">
                                    <select 
                                        value={year} 
                                        onChange={(e) => setYear(Number(e.target.value))}
                                        className="w-full appearance-none px-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none text-sm font-medium pr-8"
                                    >
                                        {YEARS.map(y => <option key={y} value={y}>{y}</option>)}
                                    </select>
                                    <div className="absolute inset-y-0 right-3 flex items-center pointer-events-none text-slate-400 dark:text-slate-500">
                                        <Icons.ChevronDown />
                                    </div>
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2">Category</label>
                                <div className="relative">
                                    <select 
                                        value={category} 
                                        onChange={(e) => setCategory(e.target.value)}
                                        className="w-full appearance-none px-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none text-sm font-medium pr-8"
                                    >
                                        {CATEGORIES.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                                    </select>
                                    <div className="absolute inset-y-0 right-3 flex items-center pointer-events-none text-slate-400 dark:text-slate-500">
                                        <Icons.ChevronDown />
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Category Buttons Quick Select */}
                        <div>
                            <div className="grid grid-cols-4 gap-2">
                                {CATEGORIES.map(cat => (
                                    <button
                                        key={cat}
                                        onClick={() => setCategory(cat)}
                                        className={`py-1.5 text-xs font-semibold rounded-lg border transition-all ${
                                            category === cat 
                                            ? 'bg-primary text-white border-primary shadow-sm' 
                                            : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700'
                                        }`}
                                    >
                                        {cat}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* District */}
                        <div>
                            <label className="block text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2">District</label>
                            <div className="relative">
                                <select 
                                    value={district} 
                                    onChange={(e) => setDistrict(e.target.value)}
                                    className="w-full appearance-none px-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none text-sm font-medium pr-8"
                                >
                                    {DISTRICTS.map(d => <option key={d} value={d}>{d}</option>)}
                                </select>
                                <div className="absolute inset-y-0 right-3 flex items-center pointer-events-none text-slate-400 dark:text-slate-500">
                                    <Icons.ChevronDown />
                                </div>
                            </div>
                        </div>

                        {/* Department */}
                        <div>
                            <label className="block text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2">Department</label>
                            <div className="relative">
                                <select 
                                    value={department} 
                                    onChange={(e) => setDepartment(e.target.value)}
                                    className="w-full appearance-none px-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none text-sm font-medium pr-8"
                                >
                                    <option value="All">All Departments</option>
                                    {DEPARTMENTS.map(d => <option key={d} value={d}>{d}</option>)}
                                </select>
                                <div className="absolute inset-y-0 right-3 flex items-center pointer-events-none text-slate-400 dark:text-slate-500">
                                    <Icons.ChevronDown />
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const App = () => {
            const [db, setDb] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [userMark, setUserMark] = useState('');
            const [searchQuery, setSearchQuery] = useState('');
            const [category, setCategory] = useState('OC');
            const [department, setDepartment] = useState('All');
            const [district, setDistrict] = useState('All');
            const [year, setYear] = useState(2025); // Default to 2025
            const [showSafe, setShowSafe] = useState(false);
            const [compareList, setCompareList] = useState([]);
            const [isCompareOpen, setIsCompareOpen] = useState(false);
            const [isFeedbackOpen, setIsFeedbackOpen] = useState(false);
            const [isMobileFilterOpen, setIsMobileFilterOpen] = useState(false);
            
            // Theme State
            const [isDark, setIsDark] = useState(true);

            useEffect(() => {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [isDark]);

            useEffect(() => {
                fetch('./data.json')
                    .then(res => res.json())
                    .then(data => {
                        setDb(data);
                        setIsLoading(false);
                    })
                    .catch(err => {
                        console.error("Error loading database:", err);
                        setIsLoading(false);
                    });
            }, []);

            // Calculate Trend
            const getTrend = (college, branch, cat, currentYear) => {
                const prevYearData = db.find(d => d.college === college && d.branch === branch && d.year === currentYear - 1);
                const currentData = db.find(d => d.college === college && d.branch === branch && d.year === currentYear);
                
                if (!prevYearData || !currentData) return null;
                
                const diff = currentData.cutoff[cat] - prevYearData.cutoff[cat];
                return diff; 
            };

            const toggleCompare = (college) => {
                if (compareList.find(c => c.id === college.id)) {
                    setCompareList(compareList.filter(c => c.id !== college.id));
                } else {
                    if (compareList.length < 4) {
                        setCompareList([...compareList, college]);
                    } else {
                        alert("You can only compare up to 4 colleges at a time.");
                    }
                }
            };

            // Memoized Filtering
            const filteredData = useMemo(() => {
                return db.filter(item => {
                    if (item.year !== year) return false;
                    if (department !== 'All' && item.branch !== department) return false;
                    if (district !== 'All' && item.district !== district) return false;
                    
                    if (searchQuery) {
                        const terms = searchQuery.toLowerCase().split(' ').filter(t => t.trim() !== '');
                        const searchStr = `${item.college} ${item.district} ${item.branch}`.toLowerCase();
                        
                        const isMatch = terms.every(term => searchStr.includes(term));
                        if (!isMatch) return false;
                    }
                    
                    if (showSafe && userMark) {
                        const cutoff = item.cutoff[category];
                        if (userMark - cutoff < 2) return false; 
                    }
                    
                    return true;
                }).sort((a, b) => (b.cutoff[category] || 0) - (a.cutoff[category] || 0)); 
            }, [searchQuery, department, district, year, showSafe, userMark, category, db]);

            if (isLoading) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-[#f8fafc] dark:bg-[#0f172a] transition-colors">
                        <div className="bg-white dark:bg-slate-800 p-10 rounded-[2rem] shadow-2xl flex flex-col items-center gap-6 animate-in fade-in zoom-in duration-500">
                            <div className="bg-slate-50 dark:bg-slate-900 rounded-full p-4 shadow-inner border border-slate-100 dark:border-slate-700">
                                <img src="./logo.png" alt="EduChoice" className="w-24 h-24 object-contain animate-pulse" />
                            </div>
                            <div className="flex flex-col items-center">
                                <h1 className="text-3xl font-black text-slate-800 dark:text-white tracking-tight mb-2">EDUCHOICE</h1>
                                <p className="text-sm font-bold text-primary tracking-wider uppercase">Loading Database...</p>
                            </div>
                            <div className="w-56 h-2 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden mt-2">
                                <div className="h-full bg-primary rounded-full animate-[pulse_1s_ease-in-out_infinite]" style={{ width: '100%' }}></div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex min-h-screen bg-[#f8fafc] dark:bg-[#0f172a] transition-colors">
                    {isMobileFilterOpen && (
                        <div 
                            className="fixed inset-0 bg-slate-900/50 dark:bg-black/50 z-30 md:hidden backdrop-blur-sm"
                            onClick={() => setIsMobileFilterOpen(false)}
                        />
                    )}

                    <FilterPanel 
                        userMark={userMark} setUserMark={setUserMark}
                        category={category} setCategory={setCategory}
                        department={department} setDepartment={setDepartment}
                        district={district} setDistrict={setDistrict}
                        year={year} setYear={setYear}
                        showSafe={showSafe} setShowSafe={setShowSafe}
                        isMobileOpen={isMobileFilterOpen} setIsMobileOpen={setIsMobileFilterOpen}
                    />

                    <main className="flex-1 flex flex-col h-screen overflow-hidden">
                        {/* Topbar */}
                        <div className="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 p-4 sticky top-0 z-20 flex gap-4 items-center transition-colors">
                            <button 
                                className="md:hidden p-2.5 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300"
                                onClick={() => setIsMobileFilterOpen(true)}
                            >
                                <Icons.Filter />
                            </button>
                            
                            <div className="relative flex-1 max-w-3xl">
                                <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                                    <Icons.Search />
                                </div>
                                <input
                                    type="text"
                                    placeholder="Search colleges by name or location..."
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="w-full pl-11 pr-4 py-2.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all text-sm"
                                />
                            </div>

                            <div className="ml-auto flex items-center gap-3">
                                <button 
                                    onClick={() => setIsFeedbackOpen(true)}
                                    className="px-4 py-2.5 bg-indigo-50 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-400 font-bold rounded-xl border border-indigo-200 dark:border-indigo-800 hover:bg-indigo-100 dark:hover:bg-indigo-900/50 transition-colors flex items-center gap-2 text-sm shadow-sm"
                                >
                                    💬 <span className="hidden sm:inline">Feedback Explore</span>
                                </button>
                                
                                {/* Theme Toggle */}
                                <button 
                                    onClick={() => setIsDark(!isDark)}
                                    className="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"
                                >
                                    {isDark ? <Icons.Sun /> : <Icons.Moon />}
                                </button>

                                {compareList.length > 0 && (
                                    <button 
                                        onClick={() => setIsCompareOpen(true)}
                                        className="px-4 py-2 bg-slate-800 dark:bg-primary text-white font-semibold rounded-lg shadow-sm hover:bg-slate-700 dark:hover:bg-primaryHover transition-colors flex items-center gap-2 text-sm"
                                    >
                                        <Icons.Scale />
                                        <span className="hidden sm:inline">Compare</span>
                                        <span className="bg-white dark:bg-white/20 text-slate-900 dark:text-white w-5 h-5 rounded-full flex items-center justify-center text-xs ml-1 font-bold">{compareList.length}</span>
                                    </button>
                                )}
                            </div>
                        </div>

                        {/* Results Area */}
                        <div className="flex-1 overflow-y-auto p-4 md:p-6 custom-scrollbar">
                            <div className="w-full">
                                <div className="mb-4 flex justify-between items-center">
                                    <div>
                                        <div className="text-sm font-semibold text-slate-500 dark:text-slate-400 bg-white dark:bg-slate-800 px-3 py-1 rounded-full border border-slate-200 dark:border-slate-700 inline-block shadow-sm">
                                            {filteredData.length} results
                                        </div>
                                    </div>
                                </div>

                                {filteredData.length === 0 ? (
                                    <div className="text-center py-20 bg-white dark:bg-slate-800/50 rounded-2xl border border-slate-200 dark:border-slate-700 border-dashed">
                                        <div className="w-16 h-16 bg-slate-50 dark:bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-400 dark:text-slate-500">
                                            <Icons.Search />
                                        </div>
                                        <h3 className="text-lg font-bold text-slate-700 dark:text-slate-200">No colleges found</h3>
                                        <p className="text-slate-500 dark:text-slate-400 mt-1">Try adjusting your filters or search query.</p>
                                    </div>
                                ) : (
                                    <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden transition-colors">
                                        <div className="overflow-x-auto custom-scrollbar">
                                            <table className="w-full text-left border-collapse whitespace-nowrap">
                                                <thead>
                                                    <tr className="bg-slate-50 dark:bg-slate-800/50 text-slate-500 dark:text-slate-400 text-xs uppercase tracking-wider font-bold border-b border-slate-200 dark:border-slate-700">
                                                        <th className="p-4 w-12 text-center">
                                                            <Icons.Scale />
                                                        </th>
                                                        <th className="p-4">College Name</th>
                                                        <th className="p-4">Branch</th>
                                                        <th className="p-4 text-center">
                                                            <div className="flex items-center justify-center gap-1">
                                                                <Icons.Award /> NIRF
                                                            </div>
                                                        </th>
                                                        <th className="p-4 text-center">
                                                            <div className="flex items-center justify-center gap-1">
                                                                <Icons.CurrencyRupee /> Placements (LPA)
                                                            </div>
                                                        </th>
                                                        {CATEGORIES.map(cat => (
                                                            <th key={cat} className={`p-4 text-center ${cat === category ? 'text-primary dark:text-indigo-400' : ''}`}>
                                                                {cat}
                                                            </th>
                                                        ))}
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                                                    {filteredData.map(item => {
                                                        const isCompared = compareList.some(c => c.id === item.id);
                                                        
                                                        // Safety Calculation
                                                        let rowStyle = "";
                                                        if (userMark) {
                                                            const diff = userMark - item.cutoff[category];
                                                            if (diff >= 2) rowStyle = "bg-emerald-50/30 dark:bg-emerald-900/20";
                                                            else if (diff >= -2) rowStyle = "bg-amber-50/30 dark:bg-amber-900/20";
                                                            else rowStyle = "bg-red-50/30 dark:bg-red-900/20";
                                                        }

                                                        return (
                                                            <tr key={item.id} className={`table-row-hover transition-colors ${rowStyle}`}>
                                                                <td className="p-4 text-center align-middle">
                                                                    <input 
                                                                        type="checkbox" 
                                                                        className="custom-checkbox mx-auto"
                                                                        checked={isCompared}
                                                                        onChange={() => toggleCompare(item)}
                                                                    />
                                                                </td>
                                                                <td className="p-4 align-middle">
                                                                    <div className="font-semibold text-slate-800 dark:text-slate-200 text-sm whitespace-normal max-w-sm leading-tight mb-1">
                                                                        {item.college}
                                                                    </div>
                                                                    <div className="text-xs text-slate-500 dark:text-slate-400 flex items-center gap-2">
                                                                        <span>{item.district}</span>
                                                                    </div>
                                                                </td>
                                                                <td className="p-4 align-middle">
                                                                    <div className="text-xs font-bold text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-900/30 px-2 py-1 rounded inline-block border border-indigo-100 dark:border-indigo-800">
                                                                        {item.branch}
                                                                    </div>
                                                                </td>
                                                                
                                                                {/* NIRF Rank */}
                                                                <td className="p-4 text-center align-middle">
                                                                    <div className="text-sm font-bold text-slate-700 dark:text-slate-300">
                                                                        {item.nirf ? `#${item.nirf}` : '-'}
                                                                    </div>
                                                                </td>

                                                                {/* Package (LPA) */}
                                                                <td className="p-4 align-middle">
                                                                    {item.package ? (
                                                                        <div className="flex items-center gap-3 justify-center text-xs">
                                                                            <div className="flex flex-col text-center">
                                                                                <span className="text-[10px] text-slate-400 dark:text-slate-500 uppercase font-bold">Avg</span>
                                                                                <span className="font-semibold text-slate-700 dark:text-slate-300">{item.package.avg}</span>
                                                                            </div>
                                                                            <div className="w-px h-6 bg-slate-200 dark:bg-slate-700"></div>
                                                                            <div className="flex flex-col text-center">
                                                                                <span className="text-[10px] text-slate-400 dark:text-slate-500 uppercase font-bold">Med</span>
                                                                                <span className="font-semibold text-slate-700 dark:text-slate-300">{item.package.median}</span>
                                                                            </div>
                                                                            <div className="w-px h-6 bg-slate-200 dark:bg-slate-700"></div>
                                                                            <div className="flex flex-col text-center">
                                                                                <span className="text-[10px] text-emerald-500 dark:text-emerald-400 uppercase font-bold">High</span>
                                                                                <span className="font-bold text-emerald-600 dark:text-emerald-400">{item.package.high}</span>
                                                                            </div>
                                                                        </div>
                                                                    ) : (
                                                                        <div className="text-center text-slate-400 text-xs">-</div>
                                                                    )}
                                                                </td>
                                                                
                                                                {/* Cutoffs */}
                                                                {CATEGORIES.map(cat => {
                                                                    const val = item.cutoff[cat];
                                                                    const trend = getTrend(item.college, item.branch, cat, item.year);
                                                                    const isMainCat = cat === category;

                                                                    return (
                                                                        <td key={cat} className={`p-4 text-center align-middle ${isMainCat ? 'bg-slate-50/50 dark:bg-slate-800/30' : ''}`}>
                                                                            <div className="flex flex-col items-center">
                                                                                <span className={`text-sm font-semibold ${isMainCat ? 'text-primary dark:text-indigo-400 text-base font-bold' : 'text-slate-700 dark:text-slate-300'}`}>
                                                                                    {val || '-'}
                                                                                </span>
                                                                                {trend !== null && trend !== 0 && val && (
                                                                                    <span className={`text-[10px] font-bold ${trend > 0 ? 'text-emerald-500 dark:text-emerald-400' : 'text-red-500 dark:text-red-400'}`}>
                                                                                        {trend > 0 ? `+${trend.toFixed(1)}` : trend.toFixed(1)}
                                                                                    </span>
                                                                                )}
                                                                            </div>
                                                                        </td>
                                                                    )
                                                                })}
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>

                    <CompareModal 
                        isOpen={isCompareOpen} 
                        onClose={() => setIsCompareOpen(false)} 
                        compareList={compareList}
                        category={category}
                        onRemove={toggleCompare}
                    />

                    <FeedbackModal 
                        isOpen={isFeedbackOpen}
                        onClose={() => setIsFeedbackOpen(false)}
                    />

                    {/* Floating 1-on-1 Session Tag */}
                    <div className="fixed bottom-6 right-6 z-40 group cursor-pointer animate-in slide-in-from-bottom-5 fade-in duration-500">
                        <div className="absolute inset-0 bg-primary/20 dark:bg-primary/40 rounded-full blur-md group-hover:blur-lg transition-all"></div>
                        <div className="relative bg-gradient-to-r from-primary to-indigo-600 dark:from-indigo-600 dark:to-primary text-white px-5 py-2.5 rounded-full shadow-xl flex items-center gap-2 border border-white/20">
                            <div className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
                            <span className="text-xs font-bold tracking-widest uppercase">1-on-1 Session Coming Soon</span>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
